<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="./styles.css">

    <script type="module" src="./main.js"></script>
</head>

<body>
    <main>
        <h1>Calculator</h1>
        <div class="container">
            <div class="display-container">
                <div class="inputs" id="inputField"></div>
                <div class="result" id="resultField"></div>
            </div>
            <div class="btns-container">
                <div class="btns-row">
                    <button type="button" class="btn" id="btn-7">7</button>
                    <button type="button" class="btn" id="btn-8">8</button>
                    <button type="button" class="btn" id="btn-9">9</button>
                    <button type="button" class="btn" id="btn-plus">+</button>
                </div>

                <div class="btns-row">
                    <button type="button" class="btn" id="btn-4">4</button>
                    <button type="button" class="btn" id="btn-5">5</button>
                    <button type="button" class="btn" id="btn-6">6</button>
                    <button type="button" class="btn" id="btn-minus">-</button>
                </div>

                <div class="btns-row">
                    <button type="button" class="btn" id="btn-1">1</button>
                    <button type="button" class="btn" id="btn-2">2</button>
                    <button type="button" class="btn" id="btn-3">3</button>
                    <button type="button" class="btn" id="btn-star">*</button>
                </div>

                <div class="btns-row">
                    <button type="button" class="btn" id="btn-0">0</button>
                    <button type="button" class="btn" id="btn-clear">C</button>
                    <button type="button" class="btn" id="btn-clear-all">AC</button>
                    <button type="button" class="btn" id="btn-slash">/</button>
                </div>

                <div class="btns-row">
                    <button type="button" class="btn" id="btn-equals">=</button>
                </div>

            </div>
        </div>
    </main>
</body>

</html>
